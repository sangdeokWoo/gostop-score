<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b0a"/>
      <stop offset="100%" stop-color="#0d1612"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(42,255,160,0.12)"/>
      <stop offset="100%" stop-color="rgba(42,255,160,0)"/>
    </radialGradient>
    <linearGradient id="cardRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2244"/>
      <stop offset="100%" stop-color="#BB000E"/>
    </linearGradient>
    <radialGradient id="moon" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8D8D8"/>
    </radialGradient>
    <radialGradient id="badge" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FF3355"/>
      <stop offset="100%" stop-color="#AA0010"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="120" y="165" width="220" height="300" rx="22"/>
    </clipPath>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 장식 원 -->
  <circle cx="950" cy="100" r="200" fill="rgba(42,255,160,0.03)"/>
  <circle cx="100" cy="550" r="150" fill="rgba(42,255,160,0.03)"/>

  <!-- 광카드 아이콘 (좌측) -->
  <!-- 카드 그림자 -->
  <rect x="134" y="181" width="220" height="300" rx="22" fill="rgba(0,0,0,0.5)"/>
  <!-- 카드 본체 -->
  <rect x="120" y="165" width="220" height="300" rx="22" fill="url(#cardRed)"/>
  <g clip-path="url(#cardClip)">
    <rect x="133" y="178" width="194" height="274" rx="16" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="4"/>
    <!-- 달 -->
    <circle cx="230" cy="265" r="80" fill="url(#moon)" stroke="#111" stroke-width="5"/>
    <ellipse cx="200" cy="235" rx="24" ry="16" fill="rgba(255,255,255,0.45)" transform="rotate(-25,200,235)"/>
    <!-- 검은 언덕 -->
    <path d="M120 330 Q230 280 340 330 L340 465 L120 465 Z" fill="#111"/>
  </g>
  <!-- 카드 외곽 테두리 -->
  <rect x="120" y="165" width="220" height="300" rx="22" fill="none" stroke="#1a0005" stroke-width="6"/>
  <!-- 光 뱃지 -->
  <circle cx="175" cy="430" r="46" fill="rgba(0,0,0,0.3)"/>
  <circle cx="175" cy="426" r="46" fill="url(#badge)" stroke="white" stroke-width="5"/>
  <text x="175" y="447" text-anchor="middle" fill="white" font-size="40" font-weight="900" font-family="Georgia, serif">光</text>

  <!-- 타이틀 텍스트 -->
  <text x="420" y="260" fill="white" font-size="72" font-weight="900"
        font-family="'Noto Sans KR', sans-serif" letter-spacing="-2">고스톱 계산기</text>

  <!-- 서브타이틀 -->
  <text x="422" y="330" fill="rgba(255,255,255,0.55)" font-size="34"
        font-family="'Noto Sans KR', sans-serif" font-weight="500">진관동 타짜들 게임판</text>

  <!-- 구분선 -->
  <rect x="420" y="360" width="680" height="2" fill="rgba(42,255,160,0.2)" rx="1"/>

  <!-- 기능 태그들 -->
  <rect x="420" y="388" width="130" height="44" rx="22" fill="rgba(42,255,160,0.12)" stroke="rgba(42,255,160,0.3)" stroke-width="1.5"/>
  <text x="485" y="416" text-anchor="middle" fill="#2affa0" font-size="22" font-family="'Noto Sans KR', sans-serif" font-weight="700">3~4인</text>

  <rect x="566" y="388" width="160" height="44" rx="22" fill="rgba(42,255,160,0.12)" stroke="rgba(42,255,160,0.3)" stroke-width="1.5"/>
  <text x="646" y="416" text-anchor="middle" fill="#2affa0" font-size="22" font-family="'Noto Sans KR', sans-serif" font-weight="700">자동 정산</text>

  <rect x="742" y="388" width="175" height="44" rx="22" fill="rgba(42,255,160,0.12)" stroke="rgba(42,255,160,0.3)" stroke-width="1.5"/>
  <text x="829" y="416" text-anchor="middle" fill="#2affa0" font-size="22" font-family="'Noto Sans KR', sans-serif" font-weight="700">모바일 최적화</text>

  <rect x="933" y="388" width="155" height="44" rx="22" fill="rgba(42,255,160,0.12)" stroke="rgba(42,255,160,0.3)" stroke-width="1.5"/>
  <text x="1010" y="416" text-anchor="middle" fill="#2affa0" font-size="22" font-family="'Noto Sans KR', sans-serif" font-weight="700">고/스톱 배율</text>

  <!-- URL -->
  <text x="420" y="530" fill="rgba(255,255,255,0.3)" font-size="24"
        font-family="'Noto Sans KR', sans-serif">sangdeokwoo.github.io/gostop-score</text>
</svg>
